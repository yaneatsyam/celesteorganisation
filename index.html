<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CELESTE ORGANISATION ★</title>

<meta name="description" content="Celeste Organisation — a digital literary and creative space.">

<style>

/* =========================================================
   CELESTE ORGANISATION
   FRUTIGER AERO × Y2K
   SINGLE-FILE GITHUB PAGES WEBSITE

   Search "EDIT" to find things you can customise.
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap');


/* =========================================================
   GLOBAL
   ========================================================= */

:root {
    --sky: #65ddff;
    --cyan: #00c9f5;
    --blue: #0074c8;
    --deep-blue: #004b91;

    --green: #5bc83b;
    --lime: #b7ef55;

    --white: #ffffff;
    --glass: rgba(255,255,255,0.58);

    --text: #06456f;

    --shadow: rgba(0,65,120,0.30);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: "Chakra Petch", Arial, sans-serif;

    color: var(--text);

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,255,255,.95),
            transparent 12%
        ),

        linear-gradient(
            #6edfff 0%,
            #c8f8ff 30%,
            #65d7ed 58%,
            #008dcb 100%
        );

    cursor: default;
}


/* =========================================================
   AERO WORLD
   ========================================================= */

.aero-world {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -10;
}


/* SUN */

.sun {
    position: absolute;

    width: 240px;
    height: 240px;

    top: 4%;
    right: 7%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 32% 28%,
            #ffffff 0%,
            #fffbc4 12%,
            #fff178 35%,
            #ffd338 65%,
            #ffad1c 100%
        );

    box-shadow:
        0 0 40px rgba(255,238,101,.8),
        0 0 110px rgba(255,255,255,.5);
}


/* CLOUDS */

.cloud {
    position: absolute;

    width: 230px;
    height: 65px;

    border-radius: 60px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 10px 25px rgba(255,255,255,.3);

    opacity: .95;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: inherit;

    border-radius: 50%;
}

.cloud::before {
    width: 100px;
    height: 100px;

    left: 30px;
    bottom: 5px;
}

.cloud::after {
    width: 75px;
    height: 75px;

    right: 30px;
    bottom: 5px;
}

.cloud.one {
    top: 13%;
    left: -250px;

    animation: cloudMove 34s linear infinite;
}

.cloud.two {
    top: 30%;
    right: -250px;

    transform: scale(.8);

    animation: cloudMoveReverse 42s linear infinite;
}

.cloud.three {
    top: 47%;
    left: -250px;

    transform: scale(.5);

    opacity: .65;

    animation: cloudMove 50s linear infinite;
}

@keyframes cloudMove {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(calc(100vw + 500px));
    }

}

@keyframes cloudMoveReverse {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(calc(-100vw - 500px));
    }

}


/* =========================================================
   WATER
   ========================================================= */

.water {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 31%;

    background:

        repeating-linear-gradient(
            170deg,
            transparent 0 15px,
            rgba(255,255,255,.20) 16px 19px,
            transparent 20px 33px
        ),

        linear-gradient(
            #19bde4,
            #087dbd
        );

    opacity: .95;
}


/* =========================================================
   GRASS
   ========================================================= */

.grass {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 110px;

    background:
        linear-gradient(
            165deg,
            transparent 0 40%,
            #75d345 41% 100%
        );

    clip-path: polygon(
        0 55%,
        4% 42%,
        7% 53%,
        10% 36%,
        14% 52%,
        18% 40%,
        22% 53%,
        27% 34%,
        31% 52%,
        36% 39%,
        41% 53%,
        46% 35%,
        51% 53%,
        56% 41%,
        61% 53%,
        66% 33%,
        71% 53%,
        76% 39%,
        81% 53%,
        86% 34%,
        91% 52%,
        96% 40%,
        100% 52%,
        100% 100%,
        0 100%
    );
}


/* =========================================================
   BUBBLES
   ========================================================= */

.bubbles {
    position: absolute;
    inset: 0;
}

.bubble {
    position: absolute;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.75);

    background:
        radial-gradient(
            circle at 30% 20%,
            white,
            rgba(255,255,255,.15) 28%,
            rgba(0,200,255,.08) 70%
        );

    box-shadow:
        inset -7px -8px 15px rgba(0,120,200,.15),
        0 0 15px rgba(255,255,255,.5);

    animation: bubbleUp linear infinite;
}

.bubble::after {
    content: "";

    position: absolute;

    width: 20%;
    height: 20%;

    top: 18%;
    left: 20%;

    border-radius: 50%;

    background: white;

    opacity: .8;
}

.bubble:nth-child(1) {
    width: 40px;
    height: 40px;

    left: 7%;
    bottom: 12%;

    animation-duration: 10s;
}

.bubble:nth-child(2) {
    width: 22px;
    height: 22px;

    left: 20%;
    bottom: 5%;

    animation-duration: 8s;
}

.bubble:nth-child(3) {
    width: 65px;
    height: 65px;

    right: 12%;
    bottom: 15%;

    animation-duration: 13s;
}

.bubble:nth-child(4) {
    width: 30px;
    height: 30px;

    right: 26%;
    bottom: 7%;

    animation-duration: 9s;
}

.bubble:nth-child(5) {
    width: 48px;
    height: 48px;

    left: 44%;
    bottom: 11%;

    animation-duration: 11s;
}

@keyframes bubbleUp {

    0% {
        transform: translateY(0);
        opacity: 0;
    }

    15% {
        opacity: .9;
    }

    100% {
        transform:
            translateY(-75vh)
            translateX(60px);

        opacity: 0;
    }

}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.site {
    width: min(1180px, calc(100% - 20px));

    margin: 15px auto 100px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.78),
            rgba(150,235,255,.25),
            rgba(255,255,255,.6)
        );

    border: 2px solid white;

    box-shadow:
        0 25px 60px rgba(0,70,120,.35),
        inset 0 2px 3px white;

    backdrop-filter: blur(14px);
}


/* =========================================================
   TOP SYSTEM BAR
   ========================================================= */

.system-bar {

    margin: 12px;

    padding: 9px 14px;

    border-radius: 15px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            #ecffff,
            #8ce9ff 45%,
            #1ca9df
        );

    border: 1px solid white;

    box-shadow:
        inset 0 2px 3px white,
        inset 0 -3px 4px rgba(0,70,130,.3);

    font-family: Orbitron, sans-serif;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .06em;
}

.online {
    color: #006c9b;
}

.led {

    display: inline-block;

    width: 9px;
    height: 9px;

    margin-right: 6px;

    border-radius: 50%;

    background: #62ff68;

    box-shadow:
        0 0 9px #62ff68;

    animation: blink 1.3s infinite;
}

@keyframes blink {

    50% {
        opacity: .3;
    }

}


/* =========================================================
   HERO
   ========================================================= */

.hero {

    position: relative;

    min-height: 450px;

    display: grid;

    place-items: center;

    text-align: center;

    padding: 50px 20px;

    overflow: hidden;

    border-radius: 25px;
}

.hero::before {

    content: "✦";

    position: absolute;

    top: 35px;
    left: 7%;

    color: white;

    font-size: 42px;

    text-shadow:
        0 0 15px white;

    animation: sparkle 2s infinite;
}

.hero::after {

    content: "✧ · * · ✦ · .";

    position: absolute;

    top: 70px;
    right: 6%;

    color: white;

    font-size: 23px;

    letter-spacing: 9px;

    animation: sparkle 3s infinite reverse;
}

@keyframes sparkle {

    50% {
        transform: scale(1.3) rotate(12deg);
        opacity: .5;
    }

}


/* =========================================================
   CELESTE ORB
   ========================================================= */

.logo-orb {

    width: 125px;
    height: 125px;

    margin: 0 auto 18px;

    display: grid;

    place-items: center;

    border-radius: 50%;

    font-family: Orbitron, sans-serif;

    font-size: 40px;

    font-weight: 900;

    color: white;

    background:

        radial-gradient(
            circle at 32% 22%,
            white 0 3%,
            #d4ffff 12%,
            transparent 13%
        ),

        linear-gradient(
            145deg,
            #d5ffff,
            #20d1ed 40%,
            #0787ca 72%,
            #0059a3
        );

    border: 4px solid white;

    box-shadow:

        0 0 0 4px rgba(50,190,255,.35),

        0 15px 35px rgba(0,70,130,.35),

        inset 8px 8px 15px rgba(255,255,255,.75),

        inset -10px -12px 20px rgba(0,70,145,.35);

    transform: rotate(-3deg);
}


/* =========================================================
   TITLE
   ========================================================= */

.hero h1 {

    margin: 0;

    font-family: Orbitron, sans-serif;

    font-size: clamp(40px, 8vw, 82px);

    line-height: .9;

    letter-spacing: -.07em;

    color: white;

    text-shadow:

        0 3px 0 #0075ae,

        0 6px 0 rgba(0,70,140,.35),

        0 14px 25px rgba(0,70,130,.35);
}

.hero h1 span {
    color: #eaffff;
}

.tagline {

    max-width: 680px;

    margin: 20px auto 25px;

    font-size: 17px;

    font-weight: 700;

    color: #07567e;

    text-shadow: 0 1px white;
}

.badge {

    display: inline-block;

    padding: 9px 17px;

    border-radius: 99px;

    background: rgba(255,255,255,.72);

    border: 1px solid white;

    box-shadow:
        inset 0 2px 5px white,
        0 7px 15px rgba(0,70,120,.2);

    font-family: Orbitron, sans-serif;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .08em;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.nav {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    padding: 12px;
}

.y2k-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-height: 39px;

    padding: 8px 16px;

    color: #004c78;

    text-decoration: none;

    font-family: Orbitron, sans-serif;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .04em;

    border: 1px solid white;

    border-radius: 13px;

    background:

        linear-gradient(
            #ffffff 0%,
            #ddfcff 25%,
            #70daf8 58%,
            #159bd3 100%
        );

    box-shadow:

        inset 0 2px 3px white,

        inset 0 -2px 4px rgba(0,70,130,.3),

        0 4px 8px rgba(0,70,120,.2);

    transition: .18s ease;

    cursor: pointer;
}

.y2k-button:hover {

    transform:
        translateY(-3px)
        scale(1.04);

    filter: saturate(1.2);

    box-shadow:

        0 9px 18px rgba(0,70,130,.3),

        inset 0 2px 4px white;
}

.y2k-button:active {

    transform:
        translateY(1px)
        scale(.98);
}


/* =========================================================
   CONTENT
   ========================================================= */

main {
    padding: 14px;
}

.grid {

    display: grid;

    grid-template-columns: repeat(12, 1fr);

    gap: 16px;
}


/* =========================================================
   Y2K WINDOWS
   ========================================================= */

.window {

    grid-column: span 6;

    min-width: 0;

    overflow: hidden;

    border-radius: 19px;

    border: 2px solid white;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(180,245,255,.55)
        );

    box-shadow:

        0 15px 30px var(--shadow),

        inset 0 1px white;

    backdrop-filter: blur(12px);
}

.window.wide {
    grid-column: span 12;
}

.window.third {
    grid-column: span 4;
}


/* WINDOW TITLE BAR */

.window-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 8px 10px;

    color: white;

    background:

        linear-gradient(
            #70ddff,
            #078dce 55%,
            #0062a9
        );

    border-bottom: 2px solid white;

    font-family: Orbitron, sans-serif;

    font-size: 11px;

    font-weight: 800;

    text-shadow: 0 1px 2px #00527d;
}

.controls {
    display: flex;
    gap: 4px;
}

.controls span {

    width: 18px;
    height: 18px;

    display: grid;
    place-items: center;

    border-radius: 5px;

    color: #006194;

    background:
        linear-gradient(
            #eaffff,
            #54c8ed
        );

    border: 1px solid white;

    box-shadow:
        inset 0 1px white;

    font-size: 10px;
}


/* WINDOW CONTENT */

.window-content {
    padding: 21px;
}

.window-content h2 {

    margin: 0 0 13px;

    color: #00669d;

    font-family: Orbitron, sans-serif;

    font-size: clamp(20px, 3vw, 29px);

    text-shadow: 0 1px white;
}

.window-content h3 {
    color: #0071a5;
}

.window-content p {
    line-height: 1.7;
}

.edit-note {

    font-family: Orbitron, sans-serif;

    font-size: 9px;

    opacity: .55;

    letter-spacing: .04em;
}


/* =========================================================
   STAFF
   ========================================================= */

.staff-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(145px, 1fr));

    gap: 12px;
}

.aero-card {

    padding: 14px;

    border-radius: 15px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(100,220,255,.34)
        );

    border: 1px solid white;

    box-shadow:

        inset 0 2px 3px white,

        0 5px 12px rgba(0,80,130,.13);

    transition: .2s ease;
}

.aero-card:hover {

    transform:
        translateY(-4px)
        rotate(-.5deg);
}

.avatar {

    width: 58px;
    height: 58px;

    display: grid;
    place-items: center;

    margin-bottom: 10px;

    border-radius: 50%;

    color: white;

    font-family: Orbitron, sans-serif;

    font-weight: 900;

    font-size: 19px;

    background:

        linear-gradient(
            145deg,
            #dfffff,
            #17c9ee 45%,
            #006db2
        );

    border: 3px solid white;

    box-shadow:

        inset 5px 5px 10px rgba(255,255,255,.8),

        inset -5px -6px 10px rgba(0,70,130,.35);
}

.aero-card strong {

    display: block;

    color: #005d90;

    font-family: Orbitron, sans-serif;

    font-size: 12px;
}

.role {

    display: inline-block;

    margin-top: 5px;

    color: #348700;

    font-size: 11px;

    font-weight: 800;
}


/* =========================================================
   EIC LETTER
   ========================================================= */

.letter {

    position: relative;

    padding: 25px;

    border-radius: 15px;

    background:

        linear-gradient(
            rgba(255,255,255,.78),
            rgba(225,251,255,.7)
        ),

        repeating-linear-gradient(
            0deg,
            transparent 0 26px,
            rgba(0,145,190,.12) 27px
        );

    border: 1px solid white;

    box-shadow:
        inset 0 2px 8px rgba(255,255,255,.8);
}

.letter::after {

    content: "CELESTE // PRIVATE NOTE";

    position: absolute;

    top: 13px;
    right: 15px;

    font-family: Orbitron, sans-serif;

    font-size: 8px;

    opacity: .3;
}

.signature {

    margin-top: 18px;

    color: #0074a8;

    font-family: "Brush Script MT", cursive;

    font-size: 28px;
}


/* =========================================================
   ISSUES
   ========================================================= */

.issue-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));

    gap: 13px;
}

.issue {

    min-height: 190px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    background:

        radial-gradient(
            circle at 75% 17%,
            white 0 4%,
            transparent 5%
        ),

        linear-gradient(
            145deg,
            #f4ffff,
            #72def7 50%,
            #078bc5
        );
}

.issue-number {

    font-family: Orbitron, sans-serif;

    font-size: 10px;

    font-weight: 800;
}

.issue h3 {

    margin: 8px 0;

    color: #00578c;
}


/* =========================================================
   APPLICATION
   ========================================================= */

.application {

    display: grid;

    grid-template-columns:
        1.1fr .9fr;

    gap: 18px;
}

.form {

    display: grid;

    gap: 11px;
}

.form label {

    display: block;

    margin-bottom: 5px;

    font-family: Orbitron, sans-serif;

    font-size: 9px;

    font-weight: 800;

    color: #006292;

    letter-spacing: .08em;
}

.form input,
.form textarea,
.form select {

    width: 100%;

    padding: 11px;

    border: 1px solid white;

    border-radius: 10px;

    outline: none;

    color: #07547a;

    font: inherit;

    background: rgba(255,255,255,.75);

    box-shadow:
        inset 0 2px 5px rgba(0,80,130,.12),
        0 1px white;
}

.form textarea {

    min-height: 110px;

    resize: vertical;
}

.form input:focus,
.form textarea:focus,
.form select:focus {

    box-shadow:

        0 0 0 3px rgba(53,240,226,.3),

        inset 0 2px 5px rgba(0,80,130,.12);
}

.requirements {

    display: grid;

    gap: 9px;

    align-content: center;
}

.requirement {

    padding: 10px 12px;

    border-radius: 10px;

    background: rgba(255,255,255,.55);

    border: 1px solid white;
}


/* =========================================================
   LINKS
   ========================================================= */

.links {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(130px, 1fr));

    gap: 10px;
}

.link {

    padding: 15px 10px;

    text-align: center;

    text-decoration: none;

    color: #005a88;

    font-family: Orbitron, sans-serif;

    font-size: 10px;

    font-weight: 800;

    border-radius: 13px;

    border: 1px solid white;

    background:

        linear-gradient(
            #fff,
            #c7faff 40%,
            #4bc8ed
        );

    box-shadow:

        inset 0 2px 4px white,

        0 5px 10px rgba(0,70,120,.15);

    transition: .18s;
}

.link:hover {

    transform:
        translateY(-3px)
        rotate(1deg);

    filter: brightness(1.08);
}

.link-icon {

    display: block;

    margin-bottom: 7px;

    font-size: 25px;
}

.link small {
    display: block;
    margin-top: 5px;
    font-family: "Chakra Petch", Arial, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .0
